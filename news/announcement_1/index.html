2015 </p> </header> <article class="post-content"> <div id="markdown-content"> <p>A simple inline announcement.</p> </div> </article> <div class="post-social-actions"> <button class="post-social-link post-like-button" data-like-key="--news--announcement_1--" type="button" aria-label="Like this post"> <i class="fa-regular fa-heart fa-sm"></i> Like <span class="post-like-count">0</span> </button> <button class="post-social-link post-comment-focus" type="button" aria-label="Write a comment"> <i class="fa-regular fa-comment fa-sm"></i> Comment </button> <button class="post-social-link post-repo-star-button" data-repo-key="Luoyu126/Luoyu126.github.io" type="button" aria-label="Star this repository"> <i class="fa-regular fa-star fa-sm"></i> Star Repo <span class="post-repo-star-count">0</span> </button> </div> <section id="post-comments" class="post-comment-section"> <h3>Comments</h3> <form id="post-comment-form" class="post-comment-form"> <input id="post-comment-name" type="text" maxlength="40" placeholder="Your name (optional)"> <textarea id="post-comment-text" rows="4" maxlength="1000" placeholder="Write your comment..."></textarea> <button type="submit" class="post-comment-submit">Post Comment</button> </form> <p class="post-comment-note">Comments are shown instantly below this post.</p> <div id="post-comment-empty" class="post-comment-empty">No comments yet.</div> <ul id="post-comment-list" class="post-comment-list"></ul> </section> <script>
    (() => {
      const LIKE_NAMESPACE = "chenyy-homepage-post-likes";
      const STAR_NAMESPACE = "chenyy-homepage-repo-stars";

      const likeButton = document.querySelector(".post-like-button");
      const repoStarButton = document.querySelector(".post-repo-star-button");
      const commentFocusButton = document.querySelector(".post-comment-focus");
      const commentForm = document.getElementById("post-comment-form");
      const commentNameInput = document.getElementById("post-comment-name");
      const commentTextInput = document.getElementById("post-comment-text");
      const commentList = document.getElementById("post-comment-list");
      const commentEmpty = document.getElementById("post-comment-empty");

      const readLocalCount = (namespace, rawKey) => {
        const value = Number(localStorage.getItem(`counter:${namespace}:${rawKey}`));
        return Number.isFinite(value) ? value : 0;
      };

      const writeLocalCount = (namespace, rawKey, value) => {
        localStorage.setItem(`counter:${namespace}:${rawKey}`, String(value));
      };

      const readLocalFlag = (namespace, rawKey) => {
        return localStorage.getItem(`flag:${namespace}:${rawKey}`) === "true";
      };

      const writeLocalFlag = (namespace, rawKey) => {
        localStorage.setItem(`flag:${namespace}:${rawKey}`, "true");
      };

      const getRemoteCount = async (namespace, rawKey) => {
        const key = encodeURIComponent(rawKey || "");
        try {
          const response = await fetch(`https://api.countapi.xyz/get/${namespace}/${key}`);
          const data = await response.json();
          const value = Number(data.value) || 0;
          writeLocalCount(namespace, rawKey, value);
          return value;
        } catch (error) {
          return readLocalCount(namespace, rawKey);
        }
      };

      const hitRemoteCount = async (namespace, rawKey) => {
        const key = encodeURIComponent(rawKey || "");
        try {
          const response = await fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`);
          const data = await response.json();
          const value = Number(data.value) || 0;
          writeLocalCount(namespace, rawKey, value);
          return value;
        } catch (error) {
          const fallbackValue = readLocalCount(namespace, rawKey) + 1;
          writeLocalCount(namespace, rawKey, fallbackValue);
          return fallbackValue;
        }
      };

      const bindCounterButton = ({
        button,
        namespace,
        rawKey,
        countSelector,
        likedClass,
      }) => {
        if (!button || !rawKey) return;
        const countEl = button.querySelector(countSelector);
        if (!countEl) return;

        const setCount = (value) => {
          countEl.textContent = String(Number.isFinite(value) ? value : 0);
        };

        const setClickedState = (clicked) => {
          button.classList.toggle(likedClass, clicked);
          button.disabled = clicked;
        };

        const clicked = readLocalFlag(namespace, rawKey);
        setClickedState(clicked);
        getRemoteCount(namespace, rawKey).then(setCount);

        button.addEventListener("click", async () => {
          if (readLocalFlag(namespace, rawKey)) return;
          writeLocalFlag(namespace, rawKey);
          setClickedState(true);

          const optimisticValue = readLocalCount(namespace, rawKey) + 1;
          writeLocalCount(namespace, rawKey, optimisticValue);
          setCount(optimisticValue);

          const value = await hitRemoteCount(namespace, rawKey);
          setCount(value);
        });
      };

      bindCounterButton({
        button: likeButton,
        namespace: LIKE_NAMESPACE,
        rawKey: likeButton?.dataset.likeKey || "",
        countSelector: ".post-like-count",
        likedClass: "is-liked",
      });

      bindCounterButton({
        button: repoStarButton,
        namespace: STAR_NAMESPACE,
        rawKey: repoStarButton?.dataset.repoKey || "repo",
        countSelector: ".post-repo-star-count",
        likedClass: "is-starred",
      });

      if (commentFocusButton && commentTextInput) {
        commentFocusButton.addEventListener("click", () => {
          const commentSection = document.getElementById("post-comments");
          if (commentSection) {
            commentSection.scrollIntoView({ behavior: "smooth", block: "start" });
          }
          commentTextInput.focus();
        });
      }

      const commentStorageKey = `comments:--news--announcement_1--`;

      const loadComments = () => {
        try {
          const parsed = JSON.parse(localStorage.getItem(commentStorageKey) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      };

      const saveComments = (comments) => {
        localStorage.setItem(commentStorageKey, JSON.stringify(comments));
      };

      const renderComments = () => {
        if (!commentList || !commentEmpty) return;

        const comments = loadComments().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        commentList.innerHTML = "";
        commentEmpty.style.display = comments.length > 0 ? "none" : "block";

        comments.forEach((comment) => {
          const item = document.createElement("li");
          item.className = "post-comment-item";

          const meta = document.createElement("div");
          meta.className = "post-comment-meta";
          const date = new Date(comment.createdAt || Date.now());
          meta.textContent = `${comment.name || "Anonymous"} · ${date.toLocaleString()}`;

          const content = document.createElement("p");
          content.className = "post-comment-content";
          content.textContent = comment.text || "";

          item.appendChild(meta);
          item.appendChild(content);
          commentList.appendChild(item);
        });
      };

      renderComments();

      if (commentForm && commentTextInput) {
        commentForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const text = commentTextInput.value.trim();
          if (!text) return;

          const name = commentNameInput?.value.trim() || "Anonymous";
          const comments = loadComments();
          comments.push({
            id: Date.now(),
            name,
            text,
            createdAt: Date.now(),
          });
          saveComments(comments);
          commentTextInput.value = "";
          if (commentNameInput) commentNameInput.value = "";
          renderComments();
        });
      }
    })();
  </script> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Yunyi Chen. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?v=a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?v=85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?v=2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?v=3973019bc14d99d564bf07d1c8cd4e23"></script> <script defer src="/assets/js/copy_code.js?v=c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?v=d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABp
