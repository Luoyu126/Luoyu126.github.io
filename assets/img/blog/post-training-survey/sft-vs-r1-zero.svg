<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Traditional SFT and R1-Zero-style reinforcement learning</title>
  <desc id="desc">A two-path comparison between imitation from human demonstrations and exploration guided by success criteria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#111b35"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#4fd1ff"/><stop offset="1" stop-color="#7b8cff"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9f68"/></linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67bfff"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffb46d"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="600" y="62" fill="#f4f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="30" text-anchor="middle" font-weight="700">Two Learning Paradigms</text>
  <rect x="65" y="105" width="500" height="345" rx="24" fill="#10233d" stroke="#4fd1ff" stroke-opacity=".55"/>
  <text x="315" y="154" fill="#8edbff" font-family="Inter,Segoe UI,sans-serif" font-size="25" text-anchor="middle" font-weight="700">Traditional SFT</text>
  <rect x="110" y="205" width="145" height="82" rx="16" fill="#173654" stroke="#5ecbff"/>
  <text x="182" y="239" fill="#f4f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" text-anchor="middle">Human</text><text x="182" y="264" fill="#f4f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" text-anchor="middle">demonstrates</text>
  <path d="M270 246H370" stroke="#67bfff" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <rect x="385" y="205" width="135" height="82" rx="16" fill="url(#blue)"/>
  <text x="452" y="255" fill="#081426" font-family="Inter,Segoe UI,sans-serif" font-size="20" text-anchor="middle" font-weight="700">Imitation</text>
  <text x="315" y="355" fill="#bac8df" font-family="Inter,Segoe UI,sans-serif" font-size="19" text-anchor="middle">how to solve the problem</text>
  <rect x="635" y="105" width="500" height="345" rx="24" fill="#2a1f28" stroke="#ffb46d" stroke-opacity=".62"/>
  <text x="885" y="154" fill="#ffd192" font-family="Inter,Segoe UI,sans-serif" font-size="25" text-anchor="middle" font-weight="700">R1-Zero-style RL</text>
  <rect x="675" y="205" width="145" height="82" rx="16" fill="#4a302d" stroke="#ffc179"/>
  <text x="747" y="239" fill="#fff5e8" font-family="Inter,Segoe UI,sans-serif" font-size="18" text-anchor="middle">Define</text><text x="747" y="264" fill="#fff5e8" font-family="Inter,Segoe UI,sans-serif" font-size="18" text-anchor="middle">success</text>
  <path d="M835 246H930" stroke="#ffb46d" stroke-width="5" marker-end="url(#arrow-gold)"/>
  <circle cx="1010" cy="246" r="52" fill="url(#gold)"/>
  <path d="M985 252c18-32 34-32 51 0M990 233c12-17 24-17 38 0" fill="none" stroke="#36221d" stroke-width="5" stroke-linecap="round"/>
  <text x="885" y="355" fill="#e2cbbb" font-family="Inter,Segoe UI,sans-serif" font-size="19" text-anchor="middle">the model explores how to achieve it</text>
</svg>
