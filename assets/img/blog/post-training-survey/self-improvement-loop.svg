<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Self-improving post-training loop</title>
  <desc id="desc">Explore, generate new experience, receive feedback, learn, become stronger, and explore further.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#172a49"/><stop offset="1" stop-color="#071323"/></radialGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#64d8ff"/></marker></defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="600" cy="350" r="230" fill="none" stroke="#64d8ff" stroke-opacity=".16" stroke-width="58"/>
  <g fill="none" stroke="#64d8ff" stroke-width="5" marker-end="url(#a)">
    <path d="M600 93A257 257 0 0 1 835 247"/><path d="M858 276A257 257 0 0 1 828 505"/><path d="M809 535A257 257 0 0 1 600 607"/><path d="M566 605A257 257 0 0 1 374 503"/><path d="M352 474A257 257 0 0 1 358 246"/><path d="M380 218A257 257 0 0 1 566 96"/>
  </g>
