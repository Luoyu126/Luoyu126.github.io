    <circle cx="850" cy="235" r="88" fill="#233458" stroke="#8ca6ff"/><text x="850" y="226" fill="#f5f7ff" font-size="20" font-weight="700">Generate new</text><text x="850" y="253" fill="#f5f7ff" font-size="20" font-weight="700">experience</text>
    <circle cx="850" cy="505" r="84" fill="#3b3155" stroke="#b698ff"/><text x="850" y="496" fill="#fff7ff" font-size="20" font-weight="700">Receive</text><text x="850" y="523" fill="#fff7ff" font-size="20" font-weight="700">feedback</text>
    <circle cx="600" cy="614" r="72" fill="#493247" stroke="#ff9fca"/><text x="600" y="622" fill="#fff7fb" font-size="23" font-weight="700">Learn</text>
    <circle cx="350" cy="505" r="84" fill="#4b362e" stroke="#ffbd7a"/><text x="350" y="496" fill="#fff8ee" font-size="20" font-weight="700">Become</text><text x="350" y="523" fill="#fff8ee" font-size="20" font-weight="700">stronger</text>
    <circle cx="350" cy="235" r="88" fill="#24463e" stroke="#72e2b4"/><text x="350" y="226" fill="#effff8" font-size="20" font-weight="700">Explore</text><text x="350" y="253" fill="#effff8" font-size="20" font-weight="700">further</text>
    <circle cx="600" cy="350" r="116" fill="#0d1b30" stroke="#f6c66f" stroke-width="3"/><text x="600" y="338" fill="#f9fcff" font-size="28" font-weight="700">Self-improving</text><text x="600" y="374" fill="#f9fcff" font-size="28" font-weight="700">post-training</text>
